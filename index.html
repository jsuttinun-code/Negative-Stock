<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบตรวจสอบสต๊อกติดลบ · CPAXTRA</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f8f4ef;--card:#fff;--tx:#2b3140;--mut:#8a92a3;--bd:#ece7e0;--g:#f5a000;--ok:#1fb5a3;--r:#e8465a;--o:#e08a00;--chip:#f1eee9;--sel:#fff4de}
:root[data-theme=dark]{--bg:#12151b;--card:#1b1f27;--tx:#e8ebf2;--mut:#8f98ab;--bd:#2a303c;--g:#fbbf24;--ok:#2dd4bf;--r:#ff6b78;--o:#f5a524;--chip:#262c37;--sel:#3a2f14}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 "Sarabun","Noto Sans Thai",system-ui,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--bd);padding:10px 24px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.logo{width:40px;height:40px;border-radius:10px;background:var(--g);color:#fff;font-weight:800;font-size:12px;display:grid;place-items:end center;padding-bottom:3px}
header h1{margin:0;font-size:18px}header small{color:var(--mut);display:block;font-size:12px}
.sp{flex:1}
button,select,input{font:inherit;color:var(--tx)}
.btn{background:var(--g);color:#fff;border:0;border-radius:8px;padding:9px 16px;cursor:pointer;font-weight:600}
.ic{background:var(--card);border:1px solid var(--bd);border-radius:8px;width:38px;height:38px;cursor:pointer;font-size:16px}
select,input[type=text],input[type=number]{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 10px}
.dsel{background:var(--chip);border-radius:8px;padding:4px 10px;display:flex;gap:6px;align-items:center;color:var(--mut);font-size:12px}
.dsel select{border:0;background:transparent;font-weight:700;font-size:14px}
.wrap{max-width:1600px;margin:0 auto;padding:22px 32px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.k{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px 18px}
.k.c{cursor:pointer}.k.c:hover,.k.on{border-color:var(--g);box-shadow:0 0 0 1px var(--g) inset}
.k span{color:var(--mut);font-size:12px}.k b{display:block;font-size:28px;margin:4px 0 2px}.k small{color:var(--mut);font-size:12px}
h3{font-size:14px;margin:22px 0 10px}
.divs{display:grid;grid-template-columns:repeat(9,1fr);gap:10px}
.d{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;cursor:pointer}
.d:hover{border-color:var(--g)}.d.on{border-color:var(--g);background:var(--sel);box-shadow:0 0 0 1px var(--g) inset}
.d div{display:flex;justify-content:space-between;font-size:11px;color:var(--mut)}.d div b{color:var(--tx);font-size:14px}
.d strong{display:block;font-size:24px;margin:4px 0 0}.d small{color:var(--mut);font-size:11px}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-top:20px}
.bar{display:flex;gap:10px;align-items:center;padding:0 18px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.tab{padding:16px 14px;cursor:pointer;color:var(--mut);border-bottom:3px solid transparent;font-weight:600}
.tab.on{color:var(--tx);border-color:var(--g)}
.bar input[type=text]{width:260px}
.more{display:none;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:12px 18px;border-bottom:1px solid var(--bd);align-items:end}
.more.show{display:grid}.more label{font-size:12px;color:var(--mut);display:block}.more select,.more input{width:100%}
.tw{overflow:auto;max-height:66vh}
table{border-collapse:collapse;width:100%;white-space:nowrap}
th{position:sticky;top:0;background:var(--card);font-size:11px;text-transform:uppercase;color:var(--tx);text-align:left;padding:12px;cursor:pointer;border-bottom:1px solid var(--bd)}
td{padding:11px 12px;border-bottom:1px solid var(--bd)}
.n{text-align:right;font-variant-numeric:tabular-nums}
tr:hover td{background:var(--sel)}
.neg{color:var(--r);font-weight:700}.mut{color:var(--mut)}
.div{background:var(--chip);border-radius:6px;padding:3px 9px;font-weight:700;font-size:12px}
.pill{background:var(--chip);border-radius:99px;padding:3px 10px;font-size:12px}.pill.new{color:var(--o)}.pill.old{color:var(--r);font-weight:700}
.foot{display:flex;justify-content:space-between;padding:10px 18px;color:var(--mut);font-size:12px;align-items:center}
.empty{padding:50px;text-align:center;color:var(--mut)}
.nv{width:auto;padding:0 14px;font-weight:600}.nv.on{background:var(--g);color:#fff;border-color:var(--g)}
.g2{display:grid;grid-template-columns:1.6fr 1fr;gap:14px;margin-top:14px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-top:14px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px 18px}.box h4{margin:0 0 12px;font-size:14px}
.ins{background:var(--sel);border:1px solid var(--g);border-radius:12px;padding:14px 18px;line-height:1.7}
.hb{display:grid;grid-template-columns:62px 1fr 92px;gap:8px;align-items:center;margin:7px 0;font-size:13px;cursor:pointer}
.hb .t{background:var(--chip);border-radius:6px;height:16px;overflow:hidden}.hb .t i{display:block;height:100%;background:var(--g);border-radius:6px}
.hb:hover b{color:var(--g)}.hb span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.up{color:var(--r)}.dn{color:var(--ok)}
body{padding-left:60px}
.rail{position:fixed;left:0;top:0;bottom:0;width:60px;background:var(--card);border-right:1px solid var(--bd);display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:14px;z-index:5}
.rail .lg{width:34px;height:34px;border-radius:50%;border:2px solid var(--g);color:var(--g);display:grid;place-items:center;font-weight:800;margin-bottom:10px}
.rail button{border:0;background:none;font-size:20px;width:42px;height:42px;border-radius:10px;cursor:pointer;opacity:.55}.rail button.on,.rail button:hover{background:var(--sel);opacity:1}
.dg{display:grid;grid-template-columns:minmax(300px,1fr) 2fr;gap:20px;align-items:start}
.cd{background:var(--card);border-radius:6px;margin-bottom:20px;box-shadow:0 1px 4px #0000000d;overflow:hidden}
.ch{padding:16px 20px;font-size:17px;font-weight:600;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}.ch small{font-weight:400;color:var(--mut);font-size:12px}
.cb{padding:14px 20px}
.tl{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:20px}
.tle{color:#fff;border-radius:6px;padding:20px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.tle i{font-style:normal;font-size:34px}.tle big{display:block;font-size:26px;font-weight:300;text-align:right}.tle small{display:block;text-align:right;font-size:13px;opacity:.95}
.rm{display:flex;align-items:center;gap:14px;padding:11px 20px;border-bottom:1px solid var(--bd);cursor:pointer;color:#2f6fd6}.rm:hover{background:var(--sel)}
.rm b{min-width:34px;text-align:center;border-radius:6px;padding:3px 6px;font-size:12px}
.kr{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;padding:18px 10px}.ki{padding:0 8px;border-right:1px solid var(--bd)}.ki:last-child{border:0}.kb{font-size:30px;margin-top:6px}
.gt{width:100%;border:1px solid var(--bd)}.gt th,.gt td{border:1px solid var(--bd);padding:10px 14px}.gt th{text-transform:none;font-size:13px;cursor:default;position:static}
.gt tr.cl{cursor:pointer}.gt a,.gt .lk{color:#2f6fd6}
.bg{border-radius:4px;color:#fff;padding:2px 9px;font-size:12px}.bg.t{background:#20bfae}.bg.r{background:#ef5350}.bg.o{background:#f5a000}.bg.n{background:var(--mut)}
.pb{width:70px;height:9px;border-radius:9px;background:var(--chip);overflow:hidden}.pb i{display:block;height:100%;background:linear-gradient(90deg,#f5a000,#7c4dff);border-radius:9px}
.pl{color:#20bfae;font-weight:800;font-size:18px;text-align:center}
.qt{background:#666;color:#eee;font-style:italic;font-size:19px;padding:44px 28px;line-height:1.6;border-radius:6px 6px 0 0}.qt small{display:block;margin-top:14px;font-size:12px;opacity:.8}
.bot{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.bot .cd{text-align:center}
@media print{.rail{display:none}body{padding:0}}
@media(max-width:1100px){.dg{grid-template-columns:1fr}.tl{grid-template-columns:repeat(2,1fr)}.kr,.bot{grid-template-columns:1fr 1fr}}
@media(max-width:700px){body{padding-left:48px}.rail{width:48px}.tl,.kr,.bot{grid-template-columns:1fr}}
#drop{display:none;position:fixed;inset:0;background:#0008;color:#fff;font-size:26px;place-items:center;z-index:9}
@media print{header .btn,header .ic,.dsel,#sync{display:none}body{background:#fff}.wrap{padding:0}}
@media(max-width:1100px){.g2,.g3{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}.divs{grid-template-columns:repeat(3,1fr)}.wrap{padding:14px}}
</style>
</head>
<body>
<nav class="rail"><div class="lg">C</div><button id="r_d" onclick="view('dash')" title="Dashboard">📊</button><button id="r_t" onclick="view('detail')" title="รายละเอียด">📋</button><button onclick="fi.click()" title="Import ไฟล์">⬆</button><button onclick="view('detail');$('more').classList.add('show')" title="ตัวกรอง/ตั้งค่า">⚙</button></nav>
<header>
  <div class="logo">SOH</div>
  <div><h1>ระบบตรวจสอบสต๊อกติดลบ (No Pack Size)</h1><small id="sub">กรองเฉพาะ ASOH &lt; 0 • ตัด Pack Size • นับอายุวันติดลบต่อเนื่อง</small></div>
  <span class="sp"></span>
  <div class="dsel">วันที่ข้อมูล: <select id="date"></select></div>
  <span id="sync" class="mut" style="font-size:12px"></span>
  <button class="btn" onclick="fi.click()">⬆ Import ไฟล์</button>
  <button class="ic" title="ตัวกรองเพิ่มเติม" onclick="$('more').classList.toggle('show')">⚙</button>
  <button class="ic" title="โหมดมืด/สว่าง" onclick="theme()">🌙</button>
  <input id="fi" type="file" accept=".xlsx,.xls,.csv" multiple hidden>
</header>
<div id="drop" style="place-items:center">วางไฟล์เพื่อ Import</div>
<div class="wrap"><div id="v_dash"></div><div id="v_detail">
  <div class="kpis" id="kpis"></div>
  <h3>แยกตาม Division (คลิกเพื่อกรอง)</h3>
  <div class="divs" id="divs"></div>
  <div class="panel">
    <div class="bar">
      <div class="tab on" id="t_cur" onclick="tab('cur')"></div><div class="tab" id="t_res" onclick="tab('res')"></div>
      <span class="sp"></span>
      <input type="text" id="q" placeholder="ค้นหา Item No / ชื่อสินค้า / Supplier...">
      <select id="age"><option value="">ทุกอายุวันติดลบ</option><option value="1">ใหม่ (1 วัน)</option><option value="2">2 วัน</option><option value="3">เรื้อรัง ≥ 3 วัน</option><option value="7">≥ 7 วัน</option></select>
      <select id="status"></select>
      <button class="btn" onclick="exp()">⬇ Export Excel</button>
    </div>
    <div class="more" id="more">
      <div><label>สาขา</label><select id="store"></select></div>
      <div><label>Buyer</label><select id="buyer"></select></div>
      <div><label>Class</label><select id="cls"></select></div>
      <div><label>ASOH ต่ำกว่า (≤)</label><input type="number" id="amin" placeholder="เช่น -10"></div>
      <div><label>มูลค่าตั้งแต่ (฿)</label><input type="number" id="vmin" placeholder="เช่น 1000"></div>
      <div><label><input type="checkbox" id="pack" checked> ตัด Pack Size</label><small class="mut" id="packn"></small></div>
      <div><button class="ic" style="width:auto;padding:0 12px" onclick="reset()">รีเซ็ตตัวกรอง</button> <button class="ic" style="width:auto;padding:0 12px" onclick="demo()">ข้อมูลตัวอย่าง</button> <button class="ic" style="width:auto;padding:0 12px" onclick="wipe()">ล้างข้อมูลทั้งหมด</button></div>
    </div>
    <div class="tw"><table id="tbl"></table></div>
    <div class="foot"><span id="cnt"></span><span id="pg"></span></div>
  </div>
</div></div>
<script>
const $=id=>document.getElementById(id), fi=$('fi');
const DIVS=[['FV','ผักและผลไม้','Dept 1'],['BUT','เนื้อสัตว์','Dept 2'],['FS','อาหารทะเล','Dept 3'],['BK','เบเกอรี่','Dept 4'],['FZ','อาหารแช่แข็ง','Dept 5'],['DF','อาหารแห้ง','Dept 6-10'],['PM','โปรโมชั่น/อื่นๆ','Dept 21-24'],['NF','นอนฟู้ด','Dept 31-46'],['OTHER','อื่นๆ','นอกเงื่อนไข']];
function divOf(d){d=+d;return d>=1&&d<=5?DIVS[d-1][0]:d>=6&&d<=10?'DF':d>=21&&d<=24?'PM':d>=31&&d<=46?'NF':'OTHER'}
let S={view:location.hash==='#detail'?'detail':'dash',snaps:{},date:'',tab:'cur',div:'',kpi:'',sk:'val',sd:-1,page:0}; const PS=200;
try{S.snaps=JSON.parse(localStorage.getItem('nsk_snaps')||'{}')}catch(e){}
try{document.documentElement.dataset.theme=localStorage.getItem('nsk_theme')||'light'}catch(e){}
function theme(){const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('nsk_theme',t)}catch(e){}}
function save(){try{localStorage.setItem('nsk_snaps',JSON.stringify(S.snaps))}catch(e){alert('พื้นที่เก็บข้อมูลในเบราว์เซอร์เต็ม — ข้อมูลจะหายเมื่อปิดหน้านี้')}}

// ---------- sync (Vercel API) ----------
let KEY='';try{KEY=localStorage.getItem('nsk_key')||''}catch(e){}
const setSync=t=>$('sync').textContent=t;
async function api(method,qs='',body){
  const r=await fetch('/api/data'+qs,{method,headers:{'Content-Type':'application/json','x-app-key':KEY},body:body?JSON.stringify(body):undefined});
  if(r.status===401){const k=prompt('ใส่รหัสผ่านเข้าระบบ');if(k==null)throw new Error('cancel');KEY=k;try{localStorage.setItem('nsk_key',k)}catch(e){}return api(method,qs,body)}
  if(!r.ok){let m='';try{m=(await r.json()).error||''}catch(e){}throw new Error(r.status+(m?' '+m:''))}return r.json();
}
async function push(d){
  const s=S.snaps[d];if(!s||Object.values(s.stores).every(x=>x.file==='demo'))return;
  try{const r=await api('GET','?date='+d);if(r)s.stores={...r.stores,...s.stores};
    await api('POST','',{date:d,data:s});setSync('ซิงค์ข้อมูลกลางแล้ว')}
  catch(e){setSync('ซิงค์ไม่สำเร็จ ('+e.message+')');console.error(e)}
}
async function pull(){
  try{setSync('กำลังซิงค์...');const {dates}=await api('GET');
    await Promise.all(dates.map(async d=>{const v=await api('GET','?date='+d);if(v)S.snaps[d]=v}));
    for(const d of Object.keys(S.snaps))if(!dates.includes(d))await push(d);
    for(const k in maps)delete maps[k];save();init();setSync('ซิงค์ข้อมูลกลางแล้ว')}
  catch(e){setSync('ออฟไลน์ ('+e.message+') — ใช้ข้อมูลในเครื่องนี้');console.error(e)}
}

// ---------- import ----------
fi.onchange=e=>load(e.target.files);
addEventListener('dragover',e=>{e.preventDefault();$('drop').style.display='grid'});
addEventListener('dragleave',e=>{if(!e.relatedTarget)$('drop').style.display='none'});
addEventListener('drop',e=>{e.preventDefault();$('drop').style.display='none';load(e.dataTransfer.files)});
async function load(files){
  const bad=[],touched=new Set();let last='';
  for(const f of files){try{
    const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:null});
    last=ingest(rows,f.name)||last;touched.add(last);
  }catch(e){bad.push(f.name)}}
  if(bad.length)alert('อ่านไฟล์ไม่ได้ (ต้องเป็นรายงาน Item List): '+bad.join(', '));
  if(last)S.date=last; save();init();
  await Promise.all([...touched].filter(Boolean).map(push));
}
function ingest(rows,fname){
  const hi=rows.findIndex(r=>r&&r.some(c=>String(c||'').trim()==='Item No')); if(hi<0)throw 0;
  let store='-',date='';
  rows.slice(0,hi).forEach(r=>(r||[]).forEach(c=>{c=String(c||'');let m;
    if(m=c.match(/Store:\s*(\w+)/i))store=m[1];
    if(m=c.match(/Date:\s*(\d{2})-(\d{2})-(\d{4})/))date=`${m[3]}-${m[2]}-${m[1]}`;}));
  if(!date){const m=fname.match(/(\d{4})-(\d{2})-(\d{2})/);date=m?m[0]:new Date().toISOString().slice(0,10)}
  const H=rows[hi].map(h=>String(h||'').trim()),ix=n=>H.indexOf(n);
  let total=0,out=[];
  for(const r of rows.slice(hi+1)){
    if(!r||r[ix('Item No')]==null)continue; total++;
    const g=n=>r[ix(n)], a=+g('ASOH')||0; if(!(a<0))continue;
    const pk=g('Pack Size'); 
    out.push({s:store,sup:String(g('Supplier')??''),buy:String(g('Buyer')??''),dept:+g('Dept No.')||0,cls:String(g('Class')??''),i:String(g('Item No')),
      desc:g('Description')??'',ls:g('Last Sales Day')??'',ld:g('Last Del Day')??'',price:+g('Selling Price')||0,asoh:a,oo:+g('On Order')||0,it:+g('In Transit')||0,
      st:g('Item Status')??'',pk:pk!=null&&String(pk).trim()!==''&&pk!==0});
  }
  (S.snaps[date]??={stores:{}}).stores[store]={total,rows:out,file:fname};
  return date;
}

// ---------- data ----------
const dates=()=>Object.keys(S.snaps).sort();
const pack=()=>$('pack').checked;
function rowsOf(d){return d?Object.values(S.snaps[d]?.stores||{}).flatMap(x=>x.rows).filter(r=>!(pack()&&r.pk)):[]}
const key=r=>r.s+'|'+r.i; const maps={};
function mapOf(d){return maps[d+pack()]??=new Map(rowsOf(d).map(r=>[key(r),r]))}
function derive(){
  const ds=dates(),ci=ds.indexOf(S.date),prevD=ci>0?ds[ci-1]:null,pm=prevD?mapOf(prevD):new Map(),cm=mapOf(S.date);
  const cur=[...cm.values()].map(r=>{
    let age=1,start=S.date;
    for(let j=ci-1;j>=0&&mapOf(ds[j]).has(key(r));j--){age=Math.round((new Date(S.date)-new Date(ds[j]))/864e5)+1;start=ds[j]}
    const p=pm.get(key(r));
    return {...r,div:divOf(r.dept),val:Math.abs(r.asoh)*r.price,prev:p?p.asoh:null,age,start}});
  const res=[...pm.values()].filter(r=>!cm.has(key(r))).map(r=>({...r,div:divOf(r.dept),val:Math.abs(r.asoh)*r.price,prev:r.asoh,age:0,start:prevD}));
  return {cur,res,prevD};
}

// ---------- ui ----------
function opts(id,arr,all){const el=$(id),v=el.value;el.innerHTML=`<option value="">${all}</option>`+[...new Set(arr.filter(x=>x!==''))].sort((a,b)=>String(a).localeCompare(String(b),'th',{numeric:true})).map(x=>`<option>${x}</option>`).join('');el.value=v}
function init(){
  const ds=dates();
  if(!S.date||!S.snaps[S.date])S.date=ds[ds.length-1]||'';
  $('date').innerHTML=ds.slice().reverse().map(d=>`<option value="${d}" ${d===S.date?'selected':''}>${d} (${Object.values(S.snaps[d].stores).reduce((a,x)=>a+x.rows.filter(r=>!(pack()&&r.pk)).length,0)} รายการ)</option>`).join('')||'<option>ยังไม่มีข้อมูล</option>';
  const all=ds.length?Object.values(S.snaps[S.date].stores).flatMap(x=>x.rows):[];
  opts('status',all.map(r=>r.st),'ทุก Item Status');opts('store',all.map(r=>r.s),'ทุกสาขา');opts('buyer',all.map(r=>r.buy),'ทุก Buyer');opts('cls',all.map(r=>r.cls),'ทุก Class');
  render();
}
$('date').onchange=e=>{S.date=e.target.value;init()};
['q','age','status','store','buyer','cls','amin','vmin','pack'].forEach(i=>$(i).oninput=()=>{S.page=0;i==='pack'?init():render()});
function tab(t){S.tab=t;S.page=0;render()}
function reset(){S.div='';S.kpi='';['q','age','status','store','buyer','cls','amin','vmin'].forEach(i=>$(i).value='');S.page=0;render()}

      <div style="padding:0 20px 20px;overflow:auto"><table class="gt"><thead><tr><th>Division</th><th>Dept</th><th class="n">รายการ</th><th class="n">มูลค่าปัจจุบัน</th><th class="n">วันก่อน</th><th>เปลี่ยนแปลง</th></tr></thead><tbody>${dvs.map(x=>`<tr class="cl" onclick="goDiv('${x.c}')"><td><span class="lk">${x.c} · ${x.n}</span></td><td>${x.d}</td><td class="n">${x.cnt}</td><td class="n">${money(x.v)}</td><td class="n">${prevD?money(x.pv):'-'}</td><td>${prevD?bd(x.v,x.pv):'-'}</td></tr>`).join('')}</tbody></table></div>`,1)}
    ${CD('10 อันดับสินค้าติดลบมูลค่าสูงสุด',`<div style="padding:14px 20px 20px;overflow:auto"><table class="gt"><thead><tr><th></th><th>รายการ</th><th>อายุติดลบ</th><th>Supplier</th><th>Status</th><th>เริ่มติดลบ</th><th class="n">ASOH</th><th class="n">มูลค่า (฿)</th></tr></thead><tbody>${top.map(r=>`<tr><td class="pl">＋</td><td><b>${esc(r.desc)}</b><div class="mut" style="font-size:12px">${esc(r.i)} · ${r.div} · Buyer ${esc(r.buy)}</div></td><td><div class="pb" title="${r.age} วัน"><i style="width:${Math.min(100,r.age/7*100)}%"></i></div><small class="mut">${r.age} วัน</small></td><td>${esc(r.sup)}</td><td><span class="bg ${r.st==='Active'?'t':'n'}">${esc(r.st)}</span></td><td>${r.start}</td><td class="n neg">${f(r.asoh)}</td><td class="n">${f(r.val,0)}</td></tr>`).join('')}</tbody></table></div>`,1)}
    <div class="cd"><div class="qt">${sum}<small>— สรุปอัตโนมัติสำหรับผู้บริหาร</small></div></div>
    <div class="bot">
      <div class="cd"><div class="cb"><div class="mut">มูลค่าติดลบรวม</div><div style="font-size:30px;font-weight:700;color:var(--r);margin:14px 0">${money(tv)}</div></div><div style="background:var(--sel);padding:14px;font-weight:700;font-size:20px;color:#3f51b5">Negative Stock</div></div>
      <div class="cd"><div class="cb"><div class="mut">สัดส่วนรายการเรื้อรัง ≥ 3 วัน</div>${gauge(pc,'#ef5350')}</div></div>
      <div class="cd"><div class="cb"><div class="mut">แนวโน้มมูลค่า</div>${spark(trend)}</div></div>
    </div></div></div>`;
}
init();pull();
</script>
</body>
